<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The normal forwarding path compared with a flowtable's fast path</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Normal path -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Normal path: every forwarded packet, before offloading</text>
  <rect x="20" y="50" width="70" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="55" y="76" text-anchor="middle" fill="#0c4a6e">arrives</text>
  <text x="55" y="94" text-anchor="middle" fill="#0c4a6e" font-weight="bold">eth0</text>

  <rect x="110" y="50" width="100" height="60" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="160" y="76" text-anchor="middle" fill="#334155" font-weight="bold">ingress</text>
  <text x="160" y="94" text-anchor="middle" fill="#64748b" font-size="12">(flowtable: miss)</text>

  <rect x="230" y="50" width="130" height="60" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="295" y="72" text-anchor="middle" fill="#7c2d12" font-weight="bold">prerouting</text>
  <text x="295" y="88" text-anchor="middle" fill="#7c2d12" font-size="12">chains, conntrack,</text>
  <text x="295" y="103" text-anchor="middle" fill="#7c2d12" font-size="12">dnat</text>

  <rect x="380" y="50" width="100" height="60" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="430" y="76" text-anchor="middle" fill="#7c2d12" font-weight="bold">routing</text>
  <text x="430" y="94" text-anchor="middle" fill="#7c2d12" font-size="12">lookup</text>

  <rect x="500" y="50" width="130" height="60" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="565" y="72" text-anchor="middle" fill="#7c2d12" font-weight="bold">forward</text>
  <text x="565" y="88" text-anchor="middle" fill="#7c2d12" font-size="12">chains (and the</text>
  <text x="565" y="103" text-anchor="middle" fill="#7c2d12" font-size="12">flow add rule)</text>

  <rect x="650" y="50" width="130" height="60" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="715" y="72" text-anchor="middle" fill="#7c2d12" font-weight="bold">postrouting</text>
  <text x="715" y="88" text-anchor="middle" fill="#7c2d12" font-size="12">chains, snat,</text>
  <text x="715" y="103" text-anchor="middle" fill="#7c2d12" font-size="12">masquerade</text>

  <rect x="800" y="50" width="80" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="840" y="76" text-anchor="middle" fill="#0c4a6e">leaves</text>
  <text x="840" y="94" text-anchor="middle" fill="#0c4a6e" font-weight="bold">eth1</text>

  <line x1="90" y1="80" x2="108" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="80" x2="228" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="80" x2="378" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="80" x2="498" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="80" x2="648" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="80" x2="798" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="136" text-anchor="middle" fill="#7c2d12">The orange steps run for every packet, and mostly give the same answer each time.</text>

  <!-- Fast path -->
  <text x="20" y="190" font-size="16" font-weight="bold" fill="#0f172a">Fast path: the packets of a connection that's been offloaded</text>
  <rect x="20" y="210" width="70" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="55" y="236" text-anchor="middle" fill="#0c4a6e">arrives</text>
  <text x="55" y="254" text-anchor="middle" fill="#0c4a6e" font-weight="bold">eth0</text>

  <rect x="110" y="210" width="100" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="160" y="236" text-anchor="middle" fill="#14532d" font-weight="bold">ingress</text>
  <text x="160" y="254" text-anchor="middle" fill="#14532d" font-size="12">(flowtable: hit)</text>

  <rect x="230" y="210" width="550" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="505" y="236" text-anchor="middle" fill="#94a3b8">skipped: prerouting, routing, forward and postrouting</text>
  <text x="505" y="254" text-anchor="middle" fill="#94a3b8" font-size="12">(none of their chains or rules see the packet)</text>

  <rect x="800" y="210" width="80" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="840" y="236" text-anchor="middle" fill="#0c4a6e">leaves</text>
  <text x="840" y="254" text-anchor="middle" fill="#0c4a6e" font-weight="bold">eth1</text>

  <line x1="90" y1="240" x2="108" y2="240" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M210,240 C260,300 740,300 798,250" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="505" y="312" text-anchor="middle" fill="#14532d">The flowtable already knows the connection's NAT, output device and next hop,</text>
  <text x="505" y="330" text-anchor="middle" fill="#14532d">so it rewrites the addresses, lowers the TTL, and sends the packet straight out.</text>

  <text x="450" y="372" text-anchor="middle" fill="#475569">Traffic to or from this machine itself (input and output) never uses the flowtable.</text>
  <text x="450" y="390" text-anchor="middle" fill="#475569">Only forwarded TCP and UDP connections can be offloaded.</text>
</svg>
