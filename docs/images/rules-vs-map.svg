<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A rule per port forward, compared with one rule and a map</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="420" fill="#ffffff"/>

  <!-- Left: a rule per forward -->
  <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Without a map: a rule per port forward</text>
  <rect x="110" y="48" width="180" height="32" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="200" y="69" text-anchor="middle" fill="#0c4a6e">packet: tcp dport 8080</text>
  <line x1="200" y1="80" x2="200" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="102" width="320" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="52" y="124" fill="#334155">rule 1: tcp dport 2222 dnat to 10.0.0.2:22</text>
  <text x="345" y="124" text-anchor="end" fill="#b91c1c" font-weight="bold">no</text>
  <line x1="200" y1="136" x2="200" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="152" width="320" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="52" y="174" fill="#334155">rule 2: tcp dport 2223 dnat to 10.0.0.5:22</text>
  <text x="345" y="174" text-anchor="end" fill="#b91c1c" font-weight="bold">no</text>
  <line x1="200" y1="186" x2="200" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="202" width="320" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="52" y="224" fill="#334155">rule 3: tcp dport 5000 dnat to 10.0.0.4:5000</text>
  <text x="345" y="224" text-anchor="end" fill="#b91c1c" font-weight="bold">no</text>

  <text x="200" y="258" text-anchor="middle" fill="#64748b" font-size="18">⋮</text>
  <text x="200" y="276" text-anchor="middle" fill="#64748b">… tried one at a time …</text>

  <rect x="40" y="290" width="320" height="34" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="52" y="312" fill="#14532d">rule 48: tcp dport 8080 dnat to 10.0.0.3:80</text>
  <text x="345" y="312" text-anchor="end" fill="#15803d" font-weight="bold">yes</text>

  <text x="200" y="352" text-anchor="middle" fill="#0f172a" font-weight="bold">48 comparisons for this packet</text>
  <text x="200" y="372" text-anchor="middle" fill="#475569">The more forwards, the more work per packet,</text>
  <text x="200" y="390" text-anchor="middle" fill="#475569">and the longer the ruleset.</text>

  <line x1="410" y1="45" x2="410" y2="400" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- Right: one rule and a map -->
  <text x="615" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">With a map: one rule, one lookup</text>
  <rect x="525" y="48" width="180" height="32" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="615" y="69" text-anchor="middle" fill="#0c4a6e">packet: tcp dport 8080</text>
  <line x1="615" y1="80" x2="615" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="102" width="330" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="615" y="124" text-anchor="middle" fill="#334155">dnat ip to tcp dport map @forwards</text>
  <line x1="615" y1="136" x2="615" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="625" y="153" fill="#475569" font-size="12">look up 8080</text>

  <!-- map table -->
  <rect x="480" y="162" width="270" height="28" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="495" y="181" font-weight="bold" fill="#0f172a">map forwards</text>
  <text x="740" y="181" text-anchor="end" fill="#475569" font-size="12">port : address . port</text>
  <rect x="480" y="190" width="270" height="26" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="495" y="208" fill="#334155">2222 : 10.0.0.2 . 22</text>
  <rect x="480" y="216" width="270" height="26" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="495" y="234" fill="#334155">2223 : 10.0.0.5 . 22</text>
  <rect x="480" y="242" width="270" height="26" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="495" y="260" fill="#334155">5000 : 10.0.0.4 . 5000</text>
  <rect x="480" y="268" width="270" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="495" y="286" fill="#14532d" font-weight="bold">8080 : 10.0.0.3 . 80</text>
  <text x="740" y="286" text-anchor="end" fill="#15803d" font-weight="bold">found</text>

  <line x1="615" y1="294" x2="615" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="510" y="320" width="210" height="30" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="615" y="340" text-anchor="middle" fill="#14532d">sent to 10.0.0.3, port 80</text>

  <text x="615" y="372" text-anchor="middle" fill="#0f172a" font-weight="bold">1 lookup, however many elements</text>
  <text x="615" y="390" text-anchor="middle" fill="#475569">A hash table (or a tree, for ranges) finds the key directly.</text>
</svg>
