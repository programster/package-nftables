<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The life of an offloaded connection</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The life of a connection with a flowtable</text>

  <rect x="20" y="60" width="180" height="96" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="110" y="84" text-anchor="middle" fill="#7c2d12" font-weight="bold">1. New connection</text>
  <text x="110" y="104" text-anchor="middle" fill="#7c2d12" font-size="12">First packets take the</text>
  <text x="110" y="120" text-anchor="middle" fill="#7c2d12" font-size="12">normal path. The chains</text>
  <text x="110" y="136" text-anchor="middle" fill="#7c2d12" font-size="12">decide: accept or drop.</text>

  <rect x="230" y="60" width="180" height="96" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="320" y="84" text-anchor="middle" fill="#7c2d12" font-weight="bold">2. Confirmed</text>
  <text x="320" y="104" text-anchor="middle" fill="#7c2d12" font-size="12">Once accepted all the</text>
  <text x="320" y="120" text-anchor="middle" fill="#7c2d12" font-size="12">way through, conntrack</text>
  <text x="320" y="136" text-anchor="middle" fill="#7c2d12" font-size="12">confirms it, NAT and all.</text>

  <rect x="440" y="60" width="180" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="530" y="84" text-anchor="middle" fill="#4c1d95" font-weight="bold">3. Offloaded</text>
  <text x="530" y="104" text-anchor="middle" fill="#4c1d95" font-size="12">The next packet reaches</text>
  <text x="530" y="120" text-anchor="middle" fill="#4c1d95" font-size="12">"flow add @fastpath",</text>
  <text x="530" y="136" text-anchor="middle" fill="#4c1d95" font-size="12">which adds it to the table.</text>

  <rect x="650" y="60" width="190" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="745" y="84" text-anchor="middle" fill="#14532d" font-weight="bold">4. Fast path</text>
  <text x="745" y="104" text-anchor="middle" fill="#14532d" font-size="12">Every later packet, both</text>
  <text x="745" y="120" text-anchor="middle" fill="#14532d" font-size="12">ways, skips the chains.</text>
  <text x="745" y="136" text-anchor="middle" fill="#14532d" font-size="12">conntrack shows [OFFLOAD].</text>

  <line x1="200" y1="108" x2="228" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="108" x2="438" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="108" x2="648" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="210" width="280" height="76" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="700" y="234" text-anchor="middle" fill="#713f12" font-weight="bold">5. Leaves the flowtable</text>
  <text x="700" y="254" text-anchor="middle" fill="#713f12" font-size="12">when it closes (TCP FIN or reset), or after</text>
  <text x="700" y="270" text-anchor="middle" fill="#713f12" font-size="12">it's idle for a while (30 seconds by default)</text>
  <line x1="745" y1="156" x2="745" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M560,248 C300,250 120,240 110,158" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="300" y="272" text-anchor="middle" fill="#475569" font-size="12">If it's still open, its packets go back through the chains,</text>
  <text x="300" y="288" text-anchor="middle" fill="#475569" font-size="12">which can accept (and offload it again) or drop it.</text>

  <text x="430" y="318" text-anchor="middle" fill="#0f172a">A connection the chains drop in step 1 is never confirmed, so it's never offloaded.</text>
</svg>
